defaults:
  - /network/base
  - _self_

name: BC
unroll_length: 80
learning_rate: 1e-4
batch_size: 64
grad_updates_per_step: 8
loss_type: mse  # options: 'mae', 'mse'
buffer_size: 1_000_000
pretrained_params_path: null
resume: true

# Early stopping on a held-out validation loss (needs path_dataset_val).
# BC's useful phase is the initial steep drop; past the plateau the policy
# fits expert noise instead of learning to drive.
# One validation replays num_scenario_per_val scenarios with the expert, so it
# costs a few training iterations - every 100 keeps the overhead at a few percent.
val_freq: 100           # validate every N iterations (0 disables validation)
early_stop_patience: 10  # stop after N consecutive validations with no improvement (0 = log only)
early_stop_min_delta: 0.0  # improvement smaller than this does not reset the patience counter
# A tanh-output policy starts near zero and so do most expert actions, so the
# validation loss is already low at init and typically rises before it falls.
# Stopping is disabled until this many env steps to keep that transient from
# ending the run at an untrained network.
early_stop_warmup_steps: 1_000_000
# The validation loss bounces ~25% between consecutive validations (the params
# themselves oscillate at this batch size), so patience on the raw value fires
# on noise. Decisions use an EMA of it instead; 0 disables the smoothing.
early_stop_smoothing: 0.7

network:
  policy:
    type: mlp
    # If this BC run is meant to warm-start SAC, match sac.yaml's policy
    # layer_sizes (and network/encoder): only arrays whose shape matches
    # transfer, so a different hidden stack means SAC's hidden layers all
    # start from scratch. The head cannot transfer either way - BC emits the
    # action, SAC emits the parameters of a distribution over it.
    layer_sizes: [256, 64, 32]
    activation: relu  # gelu, relu, selu
    final_activation: tanh
  value:
    layer_sizes: null
    activation: null
    final_activation: null
    num_networks: null
    shared_encoder: null
